<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Espace Client — IBE Construction</title>
    <link rel="icon" type="image/png" href="../images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --navy: #1a2f4b;
        --copper: #cc9461;
        --copper-light: rgba(204, 148, 97, 0.12);
        --white: #fff;
        --gray-100: #f8fafc;
        --gray-300: #e2e8f0;
        --gray-500: #64748b;
        --gray-700: #334155;
        --shadow: 0 25px 60px rgba(27, 47, 75, 0.12);
        --error: #ef4444;
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--gray-100);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .nav {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--gray-300);
        padding: 16px 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .nav a {
        text-decoration: none;
      }

      .nav-logo img {
        height: 60px;
        width: auto;
        object-fit: contain;
      }

      .nav-back {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
        color: var(--navy);
        transition: color 0.2s;
      }

      .nav-back:hover {
        color: var(--copper);
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
      }

      .card {
        background: var(--white);
        border-radius: 20px;
        box-shadow: var(--shadow);
        width: 100%;
        max-width: 440px;
        padding: 56px 48px;
        position: relative;
        overflow: hidden;
      }

      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, var(--navy), var(--copper));
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--copper-light);
        color: var(--copper);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
        padding: 6px 14px;
        border-radius: 20px;
        margin-bottom: 28px;
        text-transform: uppercase;
      }

      .card-title {
        font-size: 28px;
        font-weight: 800;
        color: var(--navy);
        margin-bottom: 6px;
        letter-spacing: -0.5px;
      }

      .card-subtitle {
        font-size: 15px;
        color: var(--gray-500);
        margin-bottom: 36px;
      }

      .form-group {
        position: relative;
        margin-bottom: 20px;
      }

      .form-group input {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid var(--gray-300);
        border-radius: 10px;
        font-size: 15px;
        font-family: "Inter", sans-serif;
        color: var(--navy);
        background: var(--white);
        outline: none;
        transition:
          border-color 0.25s,
          box-shadow 0.25s;
      }

      .form-group input:focus {
        border-color: var(--copper);
        box-shadow: 0 0 0 3px rgba(204, 148, 97, 0.15);
      }

      .form-group input.error {
        border-color: var(--error);
      }

      .form-group label {
        position: absolute;
        top: 50%;
        left: 16px;
        transform: translateY(-50%);
        font-size: 14px;
        color: var(--gray-500);
        pointer-events: none;
        transition: all 0.25s;
        background: var(--white);
        padding: 0 4px;
      }

      .form-group input:focus + label,
      .form-group input:not(:placeholder-shown) + label {
        top: 0;
        font-size: 12px;
        color: var(--copper);
        font-weight: 600;
      }

      .form-group input.error:focus + label,
      .form-group input.error:not(:placeholder-shown) + label {
        color: var(--error);
      }

      .form-options {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 28px;
        font-size: 13px;
      }

      .remember {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--gray-700);
        cursor: pointer;
      }

      .remember input[type="checkbox"] {
        accent-color: var(--copper);
        width: 16px;
        height: 16px;
        cursor: pointer;
      }

      .forgot {
        color: var(--copper);
        text-decoration: none;
        font-weight: 600;
        transition: opacity 0.2s;
      }

      .forgot:hover {
        opacity: 0.75;
      }

      .btn-login {
        width: 100%;
        padding: 15px;
        background: var(--navy);
        color: var(--white);
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        font-family: "Inter", sans-serif;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition: all 0.3s;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn-login:hover:not(:disabled) {
        background: var(--copper);
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(204, 148, 97, 0.35);
      }

      .btn-login:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
      }

      .error-banner {
        display: none;
        align-items: center;
        gap: 10px;
        background: #fff1f1;
        border: 1px solid #fecaca;
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 13px;
        color: #b91c1c;
        margin-bottom: 20px;
      }

      .error-banner.show {
        display: flex;
      }

      .info-banner {
        background: var(--copper-light);
        border: 1px solid rgba(204, 148, 97, 0.3);
        border-radius: 10px;
        padding: 14px 16px;
        font-size: 13px;
        color: var(--gray-700);
        margin-bottom: 28px;
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }

      .info-banner svg {
        flex-shrink: 0;
        margin-top: 1px;
        color: var(--copper);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .spinner {
        width: 18px;
        height: 18px;
        border: 2.5px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        flex-shrink: 0;
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }

        20%,
        60% {
          transform: translateX(-8px);
        }

        40%,
        80% {
          transform: translateX(8px);
        }
      }

      footer {
        text-align: center;
        padding: 20px;
        font-size: 12px;
        color: var(--gray-500);
      }

      @media (max-width: 500px) {
        .card {
          padding: 40px 28px;
        }

        .nav {
          padding: 12px 20px;
        }
      }
    </style>
  </head>

  <body>
    <nav class="nav">
      <a href="../index.html" class="nav-logo">
        <img src="../images/logo.png" alt="IBE Construction" />
      </a>
      <a href="../index.html" class="nav-back">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          width="18"
          height="18"
        >
          <path d="M19 12H5M12 5l-7 7 7 7" />
        </svg>
        Retour au site
      </a>
    </nav>

    <main>
      <div class="card" id="loginCard">
        <div class="badge">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            width="12"
            height="12"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          ESPACE CLIENT
        </div>

        <h1 class="card-title">Bienvenue</h1>
        <p class="card-subtitle">
          Suivez l'avancement de vos projets en temps réel.
        </p>

        <div class="error-banner" id="errorBanner">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            width="16"
            height="16"
            style="flex-shrink: 0"
          >
            <circle cx="12" cy="12" r="10" />
            <path d="M15 9l-6 6M9 9l6 6" />
          </svg>
          <span id="errorMsg">Email ou mot de passe incorrect.</span>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <input
              type="email"
              id="email"
              name="email"
              placeholder=" "
              required
              autocomplete="email"
            />
            <label for="email">Adresse email</label>
          </div>
          <div class="form-group">
            <input
              type="password"
              id="password"
              name="password"
              placeholder=" "
              required
              autocomplete="current-password"
            />
            <label for="password">Mot de passe</label>
          </div>
          <div class="form-options">
            <label class="remember">
              <input type="checkbox" name="remember" /> Se souvenir de moi
            </label>
            <a href="#" class="forgot" onclick="handleForgot(event)"
              >Mot de passe oublié ?</a
            >
          </div>
          <button type="submit" class="btn-login" id="loginBtn">
            Se connecter
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              width="16"
              height="16"
              style="margin-left: 4px"
            >
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>

        <div class="info-banner">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            width="16"
            height="16"
          >
            <circle cx="12" cy="12" r="10" />
            <path d="M12 8v4M12 16h.01" />
          </svg>
          <span
            >Vos identifiants vous sont fournis par votre chargé de projet
            IBE.</span
          >
        </div>
      </div>
    </main>

    <footer>© 2026 IBE Construction — Tous droits réservés</footer>

    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
      // Si déjà connecté → aller au dashboard (sauf si admin)
      auth.onAuthStateChanged(async (user) => {
        if (user) {
          const email = user.email.toLowerCase();
          if (email === "admin@ibe-construction.com") {
            window.location.href = "admin.html";
          } else {
            window.location.href = "dashboard.html";
          }
        }
      });

      async function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById("loginBtn");
        const email = document.getElementById("email").value;
        const pass = document.getElementById("password").value;
        const err = document.getElementById("errorBanner");
        const errMsg = document.getElementById("errorMsg");

        err.classList.remove("show");
        document.getElementById("email").classList.remove("error");
        document.getElementById("password").classList.remove("error");

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Connexion…';

        try {
          const cred = await ibeLogin(email, pass);
          if (cred.user.email === "admin@ibe-construction.com") {
            window.location.href = "admin.html";
          }
          // onAuthStateChanged handled standard redirection
        } catch (error) {
          btn.disabled = false;
          btn.innerHTML = "Se connecter →";
          document.getElementById("email").classList.add("error");
          document.getElementById("password").classList.add("error");
          err.classList.add("show");

          if (
            error.code === "auth/user-not-found" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/invalid-credential"
          ) {
            errMsg.textContent = "Email ou mot de passe incorrect.";
          } else if (error.code === "auth/too-many-requests") {
            errMsg.textContent =
              "Trop de tentatives. Réessayez dans quelques minutes.";
          } else {
            errMsg.textContent =
              "Une erreur est survenue. Vérifiez votre connexion.";
          }

          const card = document.getElementById("loginCard");
          card.style.animation = "none";
          card.offsetHeight;
          card.style.animation = "shake .4s ease";
        }
      }

      async function handleForgot(e) {
        e.preventDefault();
        const email = document.getElementById("email").value;
        if (!email) {
          document.getElementById("errorBanner").classList.add("show");
          document.getElementById("errorMsg").textContent =
            "Entrez votre email pour réinitialiser votre mot de passe.";
          return;
        }
        try {
          await auth.sendPasswordResetEmail(email);
          document.getElementById("errorBanner").style.background = "#f0fdf4";
          document.getElementById("errorBanner").style.border =
            "1px solid #bbf7d0";
          document.getElementById("errorBanner").style.color = "#15803d";
          document.getElementById("errorMsg").textContent =
            "Email de réinitialisation envoyé !";
          document.getElementById("errorBanner").classList.add("show");
        } catch {
          document.getElementById("errorMsg").textContent =
            "Aucun compte trouvé pour cet email.";
          document.getElementById("errorBanner").classList.add("show");
        }
      }
    </script>
  </body>
</html>
